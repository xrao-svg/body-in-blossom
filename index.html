<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6e8e5">
<title>BODY IN BLOSSOM — Interactive Sculpture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&display=swap" rel="stylesheet">
<style>
:root{--paper:#6d1722;--ink:#fff1ee;--red:#ffd0cd;--muted:#f2cecb;--rule:#fff4f036;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;--serif:Georgia,"Times New Roman",serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#7b1a27;color:var(--ink);font-family:var(--mono)}#app{position:relative;width:100%;height:100dvh;min-height:500px;overflow:hidden}#app::before{content:"";position:absolute;inset:-3%;z-index:0;background:url("./bg-texture.webp") center/cover no-repeat;animation:backdrop-drift 34s ease-in-out infinite alternate;will-change:transform}#app::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 52%,transparent 35%,#50101c22 100%),linear-gradient(180deg,#56101a12,transparent 28%,#56101a14)}@keyframes backdrop-drift{from{transform:scale(1.02) translate3d(-.5%,0,0)}to{transform:scale(1.075) translate3d(.5%,-.3%,0)}}.grain{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:.14;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");mix-blend-mode:multiply}.top{position:absolute;z-index:6;left:5vw;top:32px}.wordmark{font-size:11px;letter-spacing:.28em;font-weight:600}.edition{font-size:8px;color:#ffe0dd;letter-spacing:.18em;margin-top:9px}.title{position:absolute;left:5vw;top:41%;z-index:6;transform:translateY(-50%);pointer-events:none}.title .overline{font-size:8px;letter-spacing:.2em;color:#ffe0dc;margin-bottom:13px}.title h1{font:normal clamp(35px,4.5vw,60px)/.92 var(--serif);letter-spacing:-.045em;margin:0;color:#fff1ed;text-shadow:0 2px 20px #4c0c1645}.title p{font-size:10px;line-height:1.7;letter-spacing:.025em;color:#ffe9e5;margin:16px 0 0;max-width:230px}.stage{position:absolute;inset:0;z-index:2}.stage::before{content:"";position:absolute;width:min(54vw,690px);aspect-ratio:1;border:1px solid #fff0ec20;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 38px #fff0ec08,0 0 0 100px #fff0ec05;animation:orbit-breathe 8s ease-in-out infinite alternate}@keyframes orbit-breathe{from{opacity:.48;scale:.985}to{opacity:1;scale:1.015}}.stage canvas{display:block;width:100%;height:100%;outline:none}.corner-note{position:absolute;right:5vw;top:48%;z-index:6;writing-mode:vertical-rl;font-size:8px;letter-spacing:.2em;color:#ffe0dc}.bottom{position:absolute;z-index:7;left:5vw;right:5vw;bottom:28px;display:flex;align-items:flex-end;justify-content:space-between}.instruction{font-size:9px;letter-spacing:.09em;color:#ffe9e5}.instruction small{display:block;font-size:8px;letter-spacing:.12em;color:#f3c6c5;margin-top:8px}.camera{border:1px solid #fff3eead;border-radius:99px;background:#fff5f0d9;display:flex;align-items:center;gap:12px;padding:13px 19px;font:9px var(--mono);letter-spacing:.13em;color:#702632;cursor:pointer;transition:all .22s;backdrop-filter:blur(6px)}.camera:hover{background:#fffaf7;box-shadow:0 5px 24px #a63d3b18;transform:translateY(-2px)}.camera:disabled{opacity:.6;cursor:wait}.camera .icon{color:var(--red);font-size:13px}.camera.active{background:#48272c;color:#fff1ed;border-color:#48272c}.status{position:absolute;right:5vw;bottom:89px;z-index:6;font-size:8px;color:#ffe1de;letter-spacing:.14em}.pip{display:inline-block;width:5px;height:5px;border-radius:50%;background:#f3c0c0;margin-right:7px;vertical-align:middle}.status.on .pip{background:#b6434b;box-shadow:0 0 0 4px #b6434b17}.toast{position:absolute;z-index:10;left:50%;bottom:88px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#4b1621e8;color:#fff3ef;padding:10px 14px;border-radius:4px;font-size:9px;letter-spacing:.04em;transition:.25s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}#cameraVideo{display:none}.loading{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:4;font-size:9px;letter-spacing:.18em;color:#98666a}.loading.hidden{display:none}
@media(max-width:700px){#app{min-height:500px}.top{left:6vw;top:22px}.title{left:6vw;top:12%;transform:none}.title h1{font-size:34px}.title p{display:none}.stage::before{width:88vw}.corner-note{right:4vw;top:49%;font-size:7px}.bottom{left:6vw;right:6vw;bottom:18px;align-items:flex-end;gap:10px}.instruction{max-width:58%;font-size:8px;line-height:1.5}.instruction small{font-size:7px}.camera{padding:12px 14px;font-size:8px;gap:8px}.status{right:6vw;bottom:75px;font-size:7px}.toast{bottom:78px;max-width:86vw;white-space:normal;text-align:center}}
@media(prefers-reduced-motion:reduce){.camera,.toast{transition:none}#app::before,.stage::before{animation:none}}
.stage canvas{filter:drop-shadow(0 0 3px rgba(255,239,234,.18)) drop-shadow(0 0 11px rgba(246,182,184,.12))}
:root{--typewriter:"Cutive Mono","Courier Prime","Courier New",serif;--mono:var(--typewriter);--serif:var(--typewriter)}*{font-family:var(--typewriter)!important;font-synthesis:none}.camera{letter-spacing:.06em!important}.status{letter-spacing:.05em!important}.loading{letter-spacing:.06em!important}
.editorial-header{position:absolute;z-index:6;top:3.5vh;left:50%;transform:translateX(-50%);width:min(88vw,640px);text-align:center;color:#7d1c27;font-family:Georgia,"Times New Roman",serif;font-weight:400;pointer-events:none}.editorial-header p{margin:0 0 4px;font-size:clamp(10px,1.05vw,15px);line-height:1.45;letter-spacing:.065em}.title-art{display:block;width:clamp(190px,22vw,300px);height:auto;margin:8px auto 0;filter:drop-shadow(0 1px 3px rgba(110,20,28,.14))}.glyph-layer{position:absolute;inset:0;z-index:3;overflow:hidden;pointer-events:none}.glyph-layer img{position:absolute;left:0;width:100vw;height:100vh;object-fit:fill;filter:drop-shadow(0 0 5px rgba(130,12,22,.18));opacity:.92}.glyph-top{top:0}.glyph-bottom{top:82vh}.bottom-prompt{position:absolute;z-index:6;left:50%;bottom:2.2vh;transform:translateX(-50%);width:max-content;max-width:88vw;margin:0;text-align:center;color:#7d1c27;font-family:Georgia,"Times New Roman",serif;font-size:clamp(10px,1.05vw,15px);letter-spacing:.055em;line-height:1.4;pointer-events:none}.status{z-index:7;left:2.5vw;right:auto;bottom:2.5vh;color:#7d1c27}.pip{background:#9e4650}.camera{position:absolute;z-index:8;right:2.5vw;bottom:1.5vh;padding:10px 14px;border-color:#7d1c2740;background:#fff6f0a8;color:#702632;font-size:8px;backdrop-filter:blur(5px)}.camera.active{background:#48272c;color:#fff1ed;border-color:#48272c}
@media(max-width:700px){.editorial-header{top:3vh;width:90vw}.editorial-header p{font-size:10px;letter-spacing:.025em}.title-art{width:clamp(180px,50vw,250px);margin-top:6px}.glyph-layer img{left:50%;width:100vw;height:auto;transform:translateX(-50%)}.glyph-top{top:0}.glyph-bottom{top:77vh}.bottom-prompt{bottom:2.5vh;font-size:10px;max-width:72vw}.status{left:3vw;bottom:8vh;max-width:36vw;font-size:6px;line-height:1.4}.camera{right:3vw;bottom:2vh;padding:9px 11px;font-size:7px}.loading{top:54%}}
.editorial-header p{font-size:clamp(14px,1.25vw,17px)}.bottom-prompt{font-size:clamp(13px,1.15vw,16px)}.camera{font-size:10px}.status{font-size:9px}.loading,.toast{font-size:10px}
@media(max-width:700px){.editorial-header p{font-size:12px}.bottom-prompt{font-size:11px}.camera{font-size:8px}.status{font-size:7px}}
.title-art{opacity:.92;filter:blur(.08px) drop-shadow(0 0 5px rgba(145,24,34,.3)) drop-shadow(0 0 16px rgba(145,24,34,.2));animation:title-breath 5s ease-in-out infinite;will-change:filter,opacity}
@keyframes title-breath{0%,100%{opacity:.82;filter:blur(.08px) drop-shadow(0 0 4px rgba(145,24,34,.24)) drop-shadow(0 0 12px rgba(145,24,34,.14))}50%{opacity:.99;filter:blur(.1px) drop-shadow(0 0 8px rgba(145,24,34,.46)) drop-shadow(0 0 26px rgba(145,24,34,.3))}}
@media(prefers-reduced-motion:reduce){.title-art{animation:none}}
</style>

</head>
<body>
<main id="app">
<div class="grain"></div>
<header class="editorial-header"><p>a body/data/ornament study...</p><p>move your hand and let the orbit breathe...</p><img class="title-art" src="./type-title.png" alt="BODY IN BLOSSOM"></header>
<div class="stage"><canvas id="scene" aria-label="Interactive 3D wearable sculpture"></canvas></div>
<div class="loading" id="loading">LOADING YOUR SCULPTURE</div>
<div class="glyph-layer" aria-hidden="true"><img class="glyph-top" src="./type-body-in.png" alt=""></div>
<div class="status" id="status"><i class="pip"></i><span id="statusText">SCULPTURE READY · MOUSE INTERACTION</span></div>
<p class="bottom-prompt">move your hand to interact with the sculpture...</p>
<button class="camera" id="cameraButton"><span class="icon">◎</span><span id="buttonText">ACTIVATE CAMERA</span></button>
<video id="cameraVideo" playsinline muted></video><div class="toast" id="toast" role="status"></div>
</main>
<script type="module" src="./main.js"></script>
</body></html>
